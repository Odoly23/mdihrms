{% load qr_i18n %}{% if mode == 'nav' %}
<li class="dropdown">
	<a class="nl dropdown-toggle" href="#" id="ddRep" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><i class="fa fa-bar-chart" aria-hidden="true"></i> {% t 'menu.report' %}</a>
	<div class="dropdown-menu" aria-labelledby="ddRep">
		<a class="dropdown-item" href="{% qr_tab_url %}"><i class="fa fa-list" aria-hidden="true"></i> {% t 'nav.tab' %}</a>
		<a class="dropdown-item" href="{% qr_chart_url %}"><i class="fa fa-bar-chart" aria-hidden="true"></i> {% t 'nav.chart' %}</a>
	</div>
</li>
{% else %}
<details class="sb-group"{% if 'qr-dash' in request.resolver_match.url_name or 'qr-me' in request.resolver_match.url_name %} open{% endif %}><summary class="sb-grp"><i class="fa fa-bar-chart" aria-hidden="true"></i><span>{% t 'menu.report' %}</span><i class="fa fa-angle-down sb-caret" aria-hidden="true"></i></summary>
<ul>
<li><a href="{% qr_tab_url %}"><i class="fa fa-table" aria-hidden="true"></i>{% t 'nav.tab' %}</a></li>
<li><a href="{% qr_chart_url %}"><i class="fa fa-area-chart" aria-hidden="true"></i>{% t 'nav.chart' %}</a></li>
</ul></details>
{% endif %}
