{% load static %}<!DOCTYPE html>
<html lang="en"><head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MDI-HRMS - Login</title>
	<link rel="stylesheet" href="{% static 'main/css/bootstrap.min.css' %}">
	<link rel="stylesheet" href="{% static 'main/css/main.css' %}">
	<style>body{padding-top:0;display:flex;min-height:100vh;align-items:center;justify-content:center}.box{width:100%;max-width:380px;padding:16px}.btn-mdi{background:#e3171e;border-color:#e3171e;color:#fff}.btn-mdi:hover{background:#b8100f;color:#fff}</style>
</head><body>
<div class="box"><div class="card shadow-lg" style="border-top:4px solid #e3171e"><div class="card-body">
	<h4 class="text-center mb-3"><b>MDI-HRMS</b></h4>
	{% if form.errors %}<div class="alert alert-danger p-2">Username atau password salah.</div>{% endif %}
	<form method="post" autocomplete="off">{% csrf_token %}
		<div class="form-group"><label for="id_username">Username</label><input type="text" name="username" id="id_username" class="form-control" autofocus required autocapitalize="none"></div>
		<div class="form-group"><label for="id_password">Password</label><input type="password" name="password" id="id_password" class="form-control" required></div>
		<input type="hidden" name="next" value="{{ next }}">
		<button type="submit" class="btn btn-mdi btn-block py-2">Login</button>
	</form>
</div></div></div>
</body></html>
