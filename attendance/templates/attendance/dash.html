{% extends "main/layout.html" %}
{% load static qr_i18n %}
{% block content %}
<div class="breadcrumb-holder">
	<div class="container-fluid">
		<ul class="breadcrumb">
			<li class="breadcrumb-item active" aria-current="page">{{ legend|upper }}</li>
		</ul>
	</div>
</div>
<div class="container-fluid"><br/>
	<div class="row">
		<div class="col-sm-12">
			<div class="card shadow-lg pt-1 qr-border rounded">
				<div class="card-header">{{ legend|upper }}</div>
				<div class="card-body">
					{% include 'attendance/qr/_dash_button.html' %}
					{% if can.attendance_config %}<a class="btn btn-sm btn-mdi" href="{% url 'attendance-custom-dash' %}"><i class="fa fa-cogs"></i> {% t 'cfg.title' %}</a>{% endif %}
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
