<div class="topbar" role="complementary" aria-label="Kontaktu">
	<div class="container-fluid">
		<div class="tb-left">
			{% if site.address %}<span class="tb-item tb-addr" title="{{ site.address }}"><i class="fa fa-map-marker"></i> {{ site.address }}</span>{% endif %}
			{% if site.phone %}<a class="tb-item" href="{% if site.tel %}tel:{{ site.tel }}{% else %}#{% endif %}"><i class="fa fa-phone"></i> {{ site.phone }}</a>{% endif %}
			{% if site.email %}<a class="tb-item tb-mail" href="mailto:{{ site.email }}"><i class="fa fa-envelope"></i> {{ site.email }}</a>{% endif %}
		</div>
		<div class="tb-right"><span class="tb-item tb-name">{{ site.name }}</span></div>
	</div>
</div>
